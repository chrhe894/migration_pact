<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="629px" preserveAspectRatio="none" style="width:1236px;height:629px;background:#FFFFFF;" version="1.1" viewBox="0 0 1236 629" width="1236px" zoomAndPan="magnify"><title>Fristtyper: ATB (Accept till Beslut) och AT&#214; (Accept till &#214;verf&#246;ring)</title><defs/><g><g class="title" data-source-line="13"><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="446.4824" x="393.5581" y="33.1318">Fristtyper: ATB (Accept till Beslut) och AT&#214; (Accept till &#214;verf&#246;ring)</text></g><ellipse cx="835.25" cy="57.0986" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><path d="M945.2949,89.7988 L945.2949,120.6963 L925.2949,124.6963 L945.2949,128.6963 L945.2949,159.5938 A0,0 0 0 0 945.2949,159.5938 L1112.9639,159.5938 A0,0 0 0 0 1112.9639,159.5938 L1112.9639,99.7988 L1102.9639,89.7988 L945.2949,89.7988 A0,0 0 0 0 945.2949,89.7988" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1102.9639,89.7988 L1102.9639,99.7988 L1112.9639,99.7988 L1102.9639,89.7988" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="146.6689" x="951.2949" y="106.9927">Gemensam startpunkt f&#246;r</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="116.3335" x="951.2949" y="121.9414">b&#229;de ATB och AT&#214;.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="116.3145" x="951.2949" y="136.8901">G&#228;ller UT-riktningen</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="145.9771" x="951.2949" y="151.8389">(den &#246;verf&#246;rande staten).</text><rect fill="#F1F1F1" height="75.1953" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="180.0898" x="745.2051" y="87.0986"/><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="49.3359" x="755.2051" y="108.3545">ACCEPT</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="141.4453" x="755.2051" y="122.1533">godtagande (&#246;vertagande)</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="160.0898" x="755.2051" y="135.9521">eller bekr&#228;ftelse (&#229;tertagande)</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="126.0352" x="755.2051" y="149.751">&#8212; uttrycklig ELLER tyst</text><path d="M10,356.7388 L10,411.585 L434.9014,411.585 L434.9014,366.7388 L424.9014,356.7388 L10,356.7388" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M424.9014,356.7388 L424.9014,366.7388 L434.9014,366.7388 L424.9014,356.7388" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="330.5669" x="16" y="373.9326">G&#228;ller UT-riktningen (&#246;vertagande UT + &#229;tertagande UT).</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="403.9014" x="16" y="388.8813">AT&#214; har &#228;ven en instans i ansvarskompensation (lagrum att verifiera).</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="280.3379" x="16" y="403.8301">ATB &#228;r en delstr&#228;cka inom AT&#214;:s l&#228;ngre f&#246;nster.</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="780.6973" x="444.9014" y="182.2939"/><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="151.3672" x="465.9219" y="315.4399"/><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="24.6621" x="475.9219" y="336.6958">ATB</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="103.3711" x="503.918" y="336.6958">&#8212; Accept till Beslut</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="90.0352" x="475.9219" y="350.4946">2 veckor &#183; art. 42</text><path d="M646.3096,398.0376 L646.3096,421.4607 L626.3096,425.4607 L646.3096,429.4607 L646.3096,452.8838 A0,0 0 0 0 646.3096,452.8838 L797.7285,452.8838 A0,0 0 0 0 797.7285,452.8838 L797.7285,408.0376 L787.7285,398.0376 L646.3096,398.0376 A0,0 0 0 0 646.3096,398.0376" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M787.7285,398.0376 L787.7285,408.0376 L797.7285,408.0376 L787.7285,398.0376" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="130.4189" x="652.3096" y="415.2314">Missad ATB = beslutet</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="94.6563" x="652.3096" y="430.1802">&#228;r f&#246;rsenat, men</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="121.3926" x="652.3096" y="445.1289">f&#246;rfarandet forts&#228;tter.</text><rect fill="#F1F1F1" height="33.7988" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="169.4082" x="456.9014" y="408.5613"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="149.4082" x="466.9014" y="429.8171">&#214;verf&#246;ringsbeslut meddelas</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="174.7051" x="906.7813" y="208.2939"/><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="25.3301" x="916.7813" y="229.5498">AT&#214;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="126.041" x="945.4453" y="229.5498">&#8212; Accept till &#214;verf&#246;ring</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="102.0527" x="916.7813" y="243.3486">6 m&#229;nader &#183; art. 46</text><polygon fill="#F1F1F1" points="947.6631,275.8916,1040.6045,275.8916,1052.6045,288.5405,1040.6045,301.1895,947.6631,301.1895,935.6631,288.5405,947.6631,275.8916" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="92.9414" x="947.6631" y="286.2095">&#214;verklagande med</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="91.1045" x="947.6631" y="298.8584">suspensiv verkan?</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="11.6177" x="924.0454" y="286.2095">Ja</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="112.4922" x="1052.6045" y="286.2095">Nej / avvikande / f&#246;rvar</text><rect fill="#F1F1F1" height="61.3965" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="117.3828" x="847.7402" y="311.1895"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="24.668" x="857.7402" y="332.4453">AT&#214;</text><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="35.3613" x="885.7422" y="332.4453">fryses</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="97.3828" x="857.7402" y="346.2441">tills verkan upph&#246;r</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="52.0195" x="857.7402" y="360.043">(art. 43.3)</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="141.4063" x="835.7285" y="407.5859"/><text fill="