name: Generate PlantUML diagrams

on:
  push:
    paths:
      - '**/*.pu'
      - '**/*.puml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download PlantUML
        run: |
          wget -q https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar -O plantuml.jar

      - name: Generate SVG from all .pu and .puml files
        run: |
          find . -name '*.pu' -o -name '*.puml' | while read f; do
            java -jar plantuml.jar -tsvg "$f"
          done

      - name: Commit and push generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '*.svg'
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate SVG diagrams"
            git push origin HEAD:${{ github.ref_name }}
          fi
