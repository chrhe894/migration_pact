name: Generate PlantUML diagrams

on:
  push:
    paths:
      - 'docs/**/*.pu'
      - 'docs/**/*.puml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Download PlantUML
        run: |
          wget -q https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar -O plantuml.jar

      - name: Generate SVG from all .pu and .puml files
        run: |
          set -o pipefail
          echo "PlantUML source files found:"
          find docs -type f \( -name '*.pu' -o -name '*.puml' \) -print || true

          export GRAPHVIZ_DOT=/usr/bin/dot

          generated_any=false
          while IFS= read -r f; do
            echo "Rendering: $f"
            java -jar plantuml.jar -tsvg "$f"
            rc=$?
            echo "PlantUML exit code: $rc for $f"
            if [ $rc -eq 0 ]; then
              generated_any=true
            else
              echo "Warning: PlantUML failed for $f (exit $rc)"
            fi
          done < <(find docs -type f \( -name '*.pu' -o -name '*.puml' \))

          echo "Generated SVG files (if any):"
          find . -type f -name '*.svg' -print || true

          if [ "$generated_any" = false ]; then
            echo "No SVGs were generated."
          fi

      - name: Commit and push generated SVGs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Exit early if no SVG files were generated
          if ! find . -type f -name '*.svg' -print -quit | grep -q .; then
            echo "No SVG files generated — nothing to commit"
            exit 0
          fi

          # Safely collect filenames (handles spaces)
          mapfile -t svgs < <(find . -type f -name '*.svg' -print)
          git add "${svgs[@]}"

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate SVG diagrams"
            git push origin HEAD:${{ github.ref_name }}
          fi
