al" font-size="13" lengthAdjust="spacing" textLength="165.4961" x="595.0657" y="2047.1025">Undantag fr&#229;n r&#228;tt att stanna</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="75.8799" x="595.0657" y="2062.0513">kan g&#228;lla vid:</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="175.0938" x="595.0657" y="2077">&#8226; a) f&#246;rsta efterf&#246;ljande, enbart</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="148.1416" x="613.1248" y="2091.9487">f&#246;rdr&#246;jningssyfte och inga</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="128.6099" x="613.1248" y="2106.8975">nya faktorer (art. 55.7)</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="178.6865" x="595.0657" y="2121.8462">&#8226; b) andra eller ytterligare, efter</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="159.7007" x="613.1248" y="2136.7949">slutligt nekande/avslag som</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="141.6733" x="613.1248" y="2151.7437">ogrundad av f&#246;reg&#229;ende</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="12.9873" x="595.0657" y="2166.6924">---</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="96.8335" x="595.0657" y="2181.6411">OBS: detta &#228;r en</text><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="55.6118" x="695.511" y="2181.6411">r&#228;ttsf&#246;ljd</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="121.3799" x="595.0657" y="2196.5898">(stanna kvar eller ej),</text><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold"