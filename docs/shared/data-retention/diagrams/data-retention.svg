om?</text><rect fill="#F8F8F8" height="47.5977" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="148.7305" x="11" y="480.7034"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="106.7109" x="21" y="501.9592">Radera s&#229; snart MS</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="128.7305" x="21" y="515.7581">f&#229;r k&#228;nnedom (art. 72.1)</text><rect fill="#F8F8F8" height="47.5977" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="113.3809" x="441.9629" y="417.2842"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="58.0313" x="451.9629" y="438.54">Radera vid</text><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="28.0254" x="513.3281" y="438.54">10 &#229;r</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="93.3809" x="451.9629" y="452.3389">fr&#229;n slutligt beslut</text><polygon fill="#FFFFFF" points="297.0093,597.7202,309.0093,609.7202,297.0093,621.7202,285.0093,609.7202,297.0093,597.7202" style="stroke:#333333;stroke-width:0.5;"/><rect fill="#F8F8F8" height="47.5977" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="145.4023" x="726.5479" y="266.9863"/><a href="../../../domains/eurodac/articles/eur-029.md" target="_top" title="../../../domains/eurodac/articles/eur-029.md" xlink:actuate="onRequest" xlink:href="../../../domains/eurodac/articles/eur-029.md" xlink:show="new" xlink:title="../../../domains/eurodac/articles/eur-029.md" xlink:type="simple"><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" text-decoration="underline" textLength="125.4023" x="736.5479" y="288.2422">**Eurodac** (art. 29/30)</text></a><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="111.3867" x="736.5479" y="302.041">biometriska 