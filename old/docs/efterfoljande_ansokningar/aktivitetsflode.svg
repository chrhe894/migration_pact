0" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="170.5425" x="577.9308" y="1107.5933">pr&#246;vning av om nya relevanta</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="124.2935" x="577.9308" y="1122.542">omst&#228;ndigheter finns.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="577.9308" y="1137.4907">&#160;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="49.8481" x="577.9308" y="1152.4395">Otill&#229;tlig:</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="142.3525" x="577.9308" y="1167.3882">ans&#246;kan kan avvisas om</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.686" x="577.9308" y="1182.3369">relevanta nya omst&#228;ndigheter saknas.</text><rect fill="#F8F8F8" height="33.7988" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="184.7246" x="367.2062" y="1048.6025"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="164.7246" x="377.2062" y="1069.8584">Fastst&#228;ll ansvarig medlemsstat</text><rect fill="none" height="230.8916" style="stroke:#000000;stroke-width:1.5;" width="227.4063" x="345.8654" y="1212.0918"/><path d="M468.713,1212.0918 L468.713,1221.1904 L458.713,1231.1904 L345.8654,1231.1904" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="112.8477" x="348.8654" y="1226.2236">F&#246;rhandspr&#246;vning</text><rect fill="#F8F8F8" height="47.5977" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="158.7559" x="380.1906" y="1248.1904"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="138.7559" x="390.1906" y="1269.4463">Registrera &#229;beropade nya</text><text fill="#00000